# Nginx-konfiguration för sie-mcp (Streamlit)
# Placera i /etc/nginx/sites-available/sie-mcp och länka till /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name app.quiet.nu sie.quiet.nu;

    # Omdirigera till HTTPS (sköts automatiskt av certbot --nginx)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.quiet.nu sie.quiet.nu;

    # SSL-certifikat (ersätts av certbot)
    # ssl_certificate /etc/letsencrypt/live/app.quiet.nu/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.quiet.nu/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # Krävs för Streamlit WebSockets och realtidsuppdateringar
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # Streamlit healthcheck
    location /_stcore/health {
        proxy_pass http://127.0.0.1:8501/_stcore/health;
    }

    # Streamlit stream
    location /_stcore/stream {
        proxy_pass http://127.0.0.1:8501/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
